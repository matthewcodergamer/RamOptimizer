name: Build Browser Performance Manager

on:
  push:
    branches:
      - main
      - feature/browser-performance-manager
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package Chrome extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read extension version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging BrowserPerformanceManager v$VERSION"

      - name: Validate required extension files
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.json
          test -f background.js
          test -f popup.html
          test -f popup.js
          test -f popup.css
          test -f options.html
          test -f options.js
          test -f options.css
          test -f premium.js
          test -f premium-config.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node --check background.js
          node --check popup.js
          node --check options.js
          node --check premium.js
          node --check server/index.mjs

      - name: Verify production licensing is configured for releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'REPLACE_WITH_YOUR_PRODUCTION_RSA_PUBLIC_KEY' premium.js
          grep -Eq "const BPM_BILLING_URL = 'https://[^']+';" premium-config.js

      - name: Create Free build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/free/BrowserPerformanceManager/icons

          cp manifest.json dist/free/BrowserPerformanceManager/
          cp background.js premium.js premium-config.js dist/free/BrowserPerformanceManager/
          cp popup.html popup.js popup.css dist/free/BrowserPerformanceManager/
          cp options.html options.js options.css dist/free/BrowserPerformanceManager/
          cp PRIVACY.md README.md dist/free/BrowserPerformanceManager/
          cp -R icons/. dist/free/BrowserPerformanceManager/icons/

          test -f dist/free/BrowserPerformanceManager/manifest.json

      - name: Create Pro test build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pro-test/BrowserPerformanceManager/icons
          cp manifest.json dist/pro-test/BrowserPerformanceManager/
          cp background.js premium.js premium-config.js dist/pro-test/BrowserPerformanceManager/
          cp popup.html popup.js popup.css dist/pro-test/BrowserPerformanceManager/
          cp options.html options.js options.css dist/pro-test/BrowserPerformanceManager/
          cp PRIVACY.md README.md dist/pro-test/BrowserPerformanceManager/
          cp -R icons/. dist/pro-test/BrowserPerformanceManager/icons/

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out dist/pro-test/test-private-key.pem 2>/dev/null
          openssl rsa -in dist/pro-test/test-private-key.pem -pubout -out dist/pro-test/test-public-key.pem 2>/dev/null

          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const dir = 'dist/pro-test/BrowserPerformanceManager';
          const key = fs.readFileSync('dist/pro-test/test-private-key.pem', 'utf8');
          const publicKey = fs.readFileSync('dist/pro-test/test-public-key.pem', 'utf8');
          const premiumPath = dir + '/premium.js';
          const premium = fs.readFileSync(premiumPath, 'utf8');
          fs.writeFileSync(
            premiumPath,
            premium.replace(
              /-----BEGIN PUBLIC KEY-----[\s\S]*?-----END PUBLIC KEY-----/,
              publicKey.trim()
            )
          );

          const b64 = value => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = b64(JSON.stringify({alg:'RS256', typ:'JWT'}));
          const payload = b64(JSON.stringify({
            iss:'browser-performance-manager',
            aud:'extension',
            sub:'pro-test-customer',
            plan:'pro',
            exp:now + 30 * 24 * 60 * 60,
            iat:now,
            jti:crypto.randomUUID(),
            features:[
              'custom-schedules',
              'quiet-hours',
              'unlimited-protected-sites',
              'performance-history',
              'session-snapshots',
              'turbo-saver'
            ]
          }));
          const input = header + '.' + payload;
          const signature = crypto.createSign('RSA-SHA256').update(input).sign(key, 'base64url');
          fs.writeFileSync(dir + '/PRO-TEST-LICENSE.txt', input + '.' + signature + '\n');

          const manifestPath = dir + '/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.name = 'Browser Performance Manager Pro [TEST]';
          manifest.description = 'Test build of Browser Performance Manager Pro. Not for Chrome Web Store publication.';
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE

          rm -f dist/pro-test/test-private-key.pem dist/pro-test/test-public-key.pem
          test -f dist/pro-test/BrowserPerformanceManager/PRO-TEST-LICENSE.txt
          ! grep -q 'REPLACE_WITH_YOUR_PRODUCTION_RSA_PUBLIC_KEY' dist/pro-test/BrowserPerformanceManager/premium.js

      - name: Upload Free build
        uses: actions/upload-artifact@v4
        with:
          name: BrowserPerformanceManager-Free-v${{ steps.meta.outputs.version }}
          path: dist/free/BrowserPerformanceManager/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Upload Pro test build
        uses: actions/upload-artifact@v4
        with:
          name: BrowserPerformanceManager-Pro-Test-v${{ steps.meta.outputs.version }}
          path: dist/pro-test/BrowserPerformanceManager/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Create release ZIPs
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd dist/free/BrowserPerformanceManager
          zip -r "../../release/BrowserPerformanceManager-Free-${GITHUB_REF_NAME}.zip" .
          cd ../../pro-test/BrowserPerformanceManager
          zip -r "../../release/BrowserPerformanceManager-Pro-Test-${GITHUB_REF_NAME}.zip" .

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release/BrowserPerformanceManager-Free-${GITHUB_REF_NAME}.zip \
            release/BrowserPerformanceManager-Pro-Test-${GITHUB_REF_NAME}.zip \
            --title "BrowserPerformanceManager $GITHUB_REF_NAME" \
            --generate-notes
