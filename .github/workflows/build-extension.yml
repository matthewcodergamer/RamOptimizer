name: Build Browser Performance Manager

on:
  push:
    branches:
      - main
      - feature/browser-performance-manager
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package Chrome extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read extension version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging BrowserPerformanceManager v$VERSION"

      - name: Validate required extension files
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.json
          test -f background.js
          test -f popup.html
          test -f popup.js
          test -f popup.css
          test -f options.html
          test -f options.js
          test -f options.css
          test -f premium.js
          test -f premium-config.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node --check background.js
          node --check popup.js
          node --check options.js
          node --check premium.js
          node --check server/index.mjs

      - name: Verify production licensing is configured for releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'REPLACE_WITH_YOUR_PRODUCTION_RSA_PUBLIC_KEY' premium.js
          grep -Eq "const BPM_BILLING_URL = 'https://[^']+';" premium-config.js

      - name: Create clean extension package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/BrowserPerformanceManager/icons

          cp manifest.json dist/BrowserPerformanceManager/
          cp background.js premium.js premium-config.js dist/BrowserPerformanceManager/
          cp popup.html popup.js popup.css dist/BrowserPerformanceManager/
          cp options.html options.js options.css dist/BrowserPerformanceManager/
          cp PRIVACY.md README.md dist/BrowserPerformanceManager/
          cp -R icons/. dist/BrowserPerformanceManager/icons/

          # A user who downloads the Actions artifact can unzip it and point
          # chrome://extensions -> Load unpacked directly at this folder.
          test -f dist/BrowserPerformanceManager/manifest.json

      - name: Upload downloadable extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrowserPerformanceManager-v${{ steps.meta.outputs.version }}
          path: dist/BrowserPerformanceManager/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Create release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd dist/BrowserPerformanceManager
          zip -r "../../release/BrowserPerformanceManager-${GITHUB_REF_NAME}.zip" .

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "release/BrowserPerformanceManager-${GITHUB_REF_NAME}.zip" \
            --title "BrowserPerformanceManager $GITHUB_REF_NAME" \
            --generate-notes
